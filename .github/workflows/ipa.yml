name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [build9, ci-ipa]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      QB_TARGETS: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          uname -m

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust + iOS target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc -V && cargo -V

      - name: Build Rust core (XCFramework + Swift bindings)
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          ./scripts/build-core.sh

      - name: Generate project + pods
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 scripts/gen-strings.py
          xcodegen generate
          pod install --repo-update

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -workspace QB.xcworkspace -scheme QB -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "QB.app" | head -1)
          test -n "$APP"
          rm -rf Payload build/ipa
          mkdir -p Payload build/ipa
          cp -R "$APP" Payload/
          zip -qry build/ipa/QB.ipa Payload
          ls -lh build/ipa/QB.ipa
          unzip -l build/ipa/QB.ipa | grep -E "QB.app/QB$|PlugIns/QBWidget.appex/QBWidget$|MobileVLCKit" || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QB-ipa
          path: |
            build/ipa/QB.ipa
            build/xcodebuild.log
          if-no-files-found: warn

      - name: Publish IPA to ipa-artifact branch
        if: success()
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z build/ipa/QB.ipa)
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub
          cd /tmp/pub
          git checkout --orphan ipa-artifact
          git rm -rf . >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/build/ipa/QB.ipa" ./QB.ipa
          printf "run %s\ncommit %s\nbranch %s\nsize %s\n" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$SIZE" > BUILD.txt
          git add QB.ipa BUILD.txt
          git commit -q -m "IPA run ${GITHUB_RUN_NUMBER} (${SIZE} bytes)"
          git push --force origin ipa-artifact
